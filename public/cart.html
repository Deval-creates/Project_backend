<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-orange-50 min-h-screen">
    <div class="bg-slate-700 text-white p-4 flex gap-5 font-serif">
        <a href="./index.html" class="hover:text-[15px]">← Back to Shopping</a>
        <h1 class="text-xl font-bold">Your Cart</h1>
        <a href="#" class="ml-auto hover:text-[15px]">🛒 Cart (<span id="cart-count">0</span>)</a>
    </div>

    <div id="cart-items" class="p-8 flex flex-col gap-4 max-w-3xl mx-auto"></div>
    <div id="cart-total" class="text-2xl font-bold text-center mt-4 text-slate-800"></div>

    <script src="./js/main.js"></script>
    <script>
        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            cartItemsDiv.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<h2 class="text-center text-gray-500 text-xl">Cart is empty! Go buy something.</h2>';
                cartTotal.innerText = '';
                return;
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartItemsDiv.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <img src="${item.image}" class="h-16 w-16 object-contain">
                            <div>
                                <h3 class="font-bold text-sm">${item.title}</h3>
                                <p class="text-emerald-600">$${item.price} x ${item.quantity}</p>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 font-bold">Remove</button>
                    </div>
                `;
            });

            cartTotal.innerText = `Total: $${total.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            
            if (typeof updateCartCount === 'function') {
                updateCartCount();
            }
            window.dispatchEvent(new Event('cartUpdated'));
        }

        renderCart();
    </script>
</body>
</html>
